<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Swagger Autofill</title>
    <style>
      body { width: 250px; margin: 0; padding: 16px; color: #18212b; font: 14px system-ui, sans-serif; }
      h1 { margin: 0 0 8px; font-size: 17px; }
      p { margin: 0 0 14px; color: #536273; line-height: 1.4; }
      button { width: 100%; border: 0; border-radius: 6px; padding: 10px; color: white; background: #1677d2; font-weight: 600; cursor: pointer; }
      #status { min-height: 18px; margin-top: 10px; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Swagger Autofill</h1>
    <p>Remplir les champs visibles avec des exemples adaptés à leur nom et à leur type.</p>
    <button id="fill">Remplir les champs</button>
    <div id="status" role="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
